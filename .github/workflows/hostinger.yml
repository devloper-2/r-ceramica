name: Deploy WordPress to Hostinger via SSH

on:
  push:
    branches:
      - wordpress

jobs:
  deploy:
    name: rsync Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 82.25.107.184 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='wp-config.php' \
            --exclude='wp-content/uploads/' \
            --exclude='node_modules/' \
            --exclude='*.md' \
            ./ u715248258@82.25.107.184:/home/u715248258/domains/rceramica.com/public_html/staging/

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p 65002 \
            -o StrictHostKeyChecking=no \
            u715248258@82.25.107.184 \
            "echo '✅ Deploy complete at:' && date && grep -n 'echo date' /home/u715248258/domains/rceramica.com/public_html/staging/wp-content/themes/rceramica-luxury/footer.php"
