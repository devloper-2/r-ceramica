name: Deploy staging site

# Fires when admin clicks "Publish site" in the CI4 admin panel.
# The Publish controller sends a repository_dispatch event to GitHub.
on:
  repository_dispatch:
    types: [rebuild-site]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-nextjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Generate site data from live API
        run: node scripts/gen-site-data.mjs
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}

      - name: Generate sitemap
        run: node scripts/gen-sitemap.mjs

      - name: Build static export
        run: npx cross-env STATIC_EXPORT=true next build
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          NEXT_PUBLIC_API_URL: https://admin.rceramica.com/api/v1
          STATIC_EXPORT: "true"

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: frontend-nextjs/out/
          server-dir: public_html/staging/
          dangerous-clean-slate: false
