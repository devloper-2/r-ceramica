name: Deploy staging site

on:
  repository_dispatch:
    types: [rebuild-site]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-nextjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify content API is reachable
        run: |
          echo "--- Fetching /api/v1/pages/about from live server ---"
          curl -s --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "X-API-Key: ${{ secrets.CONTENT_API_KEY }}" \
            -w "\n\nHTTP status: %{http_code}\n" \
            "https://admin.rceramica.com/api/v1/pages/about" | head -c 4000 || true
          echo ""
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "X-API-Key: ${{ secrets.CONTENT_API_KEY }}" \
            "https://admin.rceramica.com/api/v1/pages/about" || echo "000")
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Content API returned HTTP $HTTP (or timed out)."
            echo "Proceeding anyway in case of WAF blocking GitHub Actions IPs..."
          fi

      - name: Generate site data from live API
        run: node scripts/gen-site-data.mjs
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}

      - name: Generate sitemap
        run: node scripts/gen-sitemap.mjs

      - name: Build static export
        run: npx cross-env STATIC_EXPORT=true next build
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          NEXT_PUBLIC_API_URL: https://admin.rceramica.com/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "376075689230-udl2q86u08ij33bq0mrdj3ovj0p0dnn0.apps.googleusercontent.com"
          STATIC_EXPORT: "true"

      - name: Prepare output for Apache
        run: |
          # Guarantee .htaccess ships (Next.js export can skip dotfiles in public/).
          cp public/.htaccess out/.htaccess
          echo "=== out/ root ==="
          ls -la out/ | head -40
          echo "=== .htaccess in out/ ==="
          ls -la out/.htaccess
          echo "=== about.html titleLine2 in this build ==="
          grep -o -i 'titleLine2[^,}]*' out/about.html | head -3 || echo "not found"

      - name: Deploy to Hostinger via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASS }}" ftp://${{ secrets.FTP_HOST }} <<'FTPEOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set xfer:clobber on
          echo "===== FTP LOGIN DIRECTORY (pwd) ====="
          pwd
          echo "===== MIRRORING out/ -> staging/ (login dir is already public_html) ====="
          mirror --reverse --delete --verbose out/ staging/
          echo "===== TARGET AFTER DEPLOY (staging/) ====="
          cls -l staging/
          bye
          FTPEOF
