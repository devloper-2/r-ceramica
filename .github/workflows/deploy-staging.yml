name: Deploy staging site

on:
  repository_dispatch:
    types: [rebuild-site]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-nextjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm install

      # admin.rceramica.com publishes AAAA records, but GitHub-hosted runners
      # have no IPv6 route. curl survives via Happy Eyeballs (it races A/AAAA
      # and falls back to IPv4); Node's fetch can pick the IPv6 address and die
      # with an opaque "fetch failed", which is what broke the export. Force
      # IPv4-first resolution for every Node process in this job.
      - name: Probe content API the same way the build does
        run: |
          echo "--- DNS ---"
          getent ahostsv4 admin.rceramica.com || echo "no IPv4"
          getent ahostsv6 admin.rceramica.com || echo "no IPv6"
          echo "--- curl (Happy Eyeballs) ---"
          curl -s -o /dev/null -w "curl        -> HTTP %{http_code} via %{remote_ip}\n" \
            --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 5 \
            -H "X-API-Key: ${{ secrets.CONTENT_API_KEY }}" \
            "https://admin.rceramica.com/api/v1/categories" || echo "curl failed"
          echo "--- node fetch (what next build uses) ---"
          node -e '
            const url = "https://admin.rceramica.com/api/v1/categories";
            const hdr = { "X-API-Key": process.env.CONTENT_API_KEY || "" };
            const probe = async (label) => {
              try {
                const r = await fetch(url, { headers: hdr, signal: AbortSignal.timeout(25000) });
                console.log(label.padEnd(22) + "-> HTTP " + r.status);
              } catch (e) {
                const c = e.cause || {};
                console.log(label.padEnd(22) + "-> FAILED: " + e.message +
                            (c.code ? " (" + c.code + ")" : "") +
                            (c.address ? " addr=" + c.address : ""));
              }
            };
            (async () => {
              await probe("node default");
              require("node:dns").setDefaultResultOrder("ipv4first");
              await probe("node ipv4first");
            })();
          '
        env:
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}

      - name: Generate site data from live API
        run: node scripts/gen-site-data.mjs
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Generate sitemap
        run: node scripts/gen-sitemap.mjs

      - name: Build static export
        run: npx cross-env STATIC_EXPORT=true next build
        env:
          CONTENT_API_URL: https://admin.rceramica.com/api/v1
          CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
          NEXT_PUBLIC_API_URL: https://admin.rceramica.com/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: "376075689230-udl2q86u08ij33bq0mrdj3ovj0p0dnn0.apps.googleusercontent.com"
          STATIC_EXPORT: "true"
          NODE_OPTIONS: --dns-result-order=ipv4first

      - name: Prepare output for Apache
        run: |
          # Guarantee .htaccess ships (Next.js export can skip dotfiles in public/).
          cp public/.htaccess out/.htaccess
          echo "=== out/ root ==="
          ls -la out/ | head -40
          echo "=== .htaccess in out/ ==="
          ls -la out/.htaccess
          echo "=== dynamic routes exported (must not be empty) ==="
          find out/explore out/products -name index.html 2>/dev/null | head -20 || echo "NONE"
          echo "=== about titleLine2 in this build ==="
          # trailingSlash: true — pages export as <route>/index.html, not <route>.html
          grep -o -i 'titleLine2[^,}]*' out/about/index.html | head -3 || echo "not found"

      - name: Deploy to Hostinger via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USER }}","${{ secrets.FTP_PASS }}" ftp://${{ secrets.FTP_HOST }} <<'FTPEOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          set xfer:clobber on
          # FTP LIST hides dotfiles by default, so `mirror` never sees the remote
          # .htaccess and silently leaves a stale copy in place — which is how an
          # updated rewrite rule can be pushed, built and deployed yet never take
          # effect on the server. -a makes LIST include them.
          set ftp:list-options -a
          echo "===== FTP LOGIN DIRECTORY (pwd) ====="
          pwd
          echo "===== MIRRORING out/ -> staging/ (login dir is already public_html) ====="
          mirror --reverse --delete --verbose out/ staging/
          echo "===== FORCE-UPLOADING .htaccess (belt and braces) ====="
          put out/.htaccess -o staging/.htaccess
          echo "===== TARGET AFTER DEPLOY (staging/) ====="
          cls -l staging/
          bye
          FTPEOF

      - name: Verify deployed routing
        run: |
          BASE=https://staging.rceramica.com
          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$BASE$1")
            if [ "$code" = "$2" ]; then
              echo "  ok   $1 -> $code"
            else
              echo "  FAIL $1 -> $code (expected $2)"; fail=1
            fi
          }
          echo '--- routing smoke test ---'
          check /explore/ 200
          check /orders/ 200
          # Any order URL must serve the client-rendered shell, not a 404.
          check /orders/RC-SMOKE-TEST/ 200
          check /definitely-not-a-page/ 404
          if [ "$fail" = "1" ]; then
            echo '::error::Deployed routing is wrong — the .htaccess on the server is probably stale.'
            exit 1
          fi
